# Orknux Client: the same source as electron-builder.yml with no runtime and no
# jar, so it is a separate install of its own, and a small one. See AGENTS.md.
appId: ai.orknux.client
productName: Orknux Client
copyright: Copyright © 2026 Michał Szymański

directories:
  output: dist
  buildResources: build

files:
  - src/**
  - package.json

# Fixed here, so a client cannot be switched into something it holds nothing for.
extraMetadata:
  name: orknux-client
  # What names its folder under the user's profile, and the one-instance lock: the
  # server's app is "Orknux", and sharing either would stop the two living together.
  productName: Orknux Client
  desktopName: orknux-client.desktop
  orknux:
    client: true
    selfUpdate: false

extraResources:
  - from: resources/tray
    to: tray

asar: true

linux:
  target:
    - deb
    - AppImage
  category: Development
  syncDesktopName: true
  executableName: orknux-client
  icon: build/icon.png
  synopsis: Use an Orknux server from this machine.
  maintainer: Michał Szymański <michjak.szymanski@gmail.com>
  vendor: Orknux

deb:
  packageCategory: devel
  # As the server's package says why, but for the runtime it does not carry.
  depends:
    - libgtk-3-0 | libgtk-3-0t64
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0 | libatspi2.0-0t64
    - libuuid1
    - libsecret-1-0
    - libgbm1
    # The real library named first: on Ubuntu 24.04 `libasound2` is only a virtual name, which
    # apt can satisfy with liboss4-salsa-asound2, and the app then dies on a missing ALSA symbol.
    - libasound2t64 | libasound2

appImage:
  artifactName: Orknux-Client-${version}.${ext}

win:
  target:
    - nsis
    - msi
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Orknux-Client-Setup-${version}.${ext}

msi:
  perMachine: false
  artifactName: Orknux-Client-${version}.${ext}

publish: null
