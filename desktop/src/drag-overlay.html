<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- No script of its own, as tabs.html: drag-overlay-preload.js does what is done here. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>Orknux</title>
<style>
  /* Clear but for where a dragged tab would go. Over the pages for as long as a drag lasts; see tabs.js. */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #light {
    position: absolute; display: none; box-sizing: border-box; pointer-events: none;
    background: rgb(59 130 246 / 22%); border: 2px solid rgb(59 130 246 / 80%);
  }
</style>
</head>
<body>
  <div id="light"></div>
</body>
</html>
