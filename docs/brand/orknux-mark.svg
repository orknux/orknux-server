<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Orknux">
  <!--
    Primary mark. Use at 24px and above; below that use orknux-mark-hollow.svg,
    whose interior detail does not merge at small sizes.

    The kernel void is a real knockout via mask rather than a disc filled with
    the background colour, so the mark can sit on any ground.
  -->
  <defs>
    <linearGradient id="orknuxMoss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5D89C9"/>
      <stop offset="100%" stop-color="#3E6399"/>
    </linearGradient>
    <mask id="orknuxVoid">
      <rect width="200" height="200" fill="#fff"/>
      <circle cx="100" cy="109" r="47" fill="#000"/>
    </mask>
  </defs>

  <path d="M42 29 L67 50 L133 50 L158 29 L154 64 L181 113 L151 167 L49 167 L19 113 L46 64 Z"
        fill="url(#orknuxMoss)" mask="url(#orknuxVoid)"/>

  <path d="M81 125 L112 129 L121 96 Z"
        fill="none" stroke="#4F7FC4" stroke-width="8" stroke-linejoin="round"/>
  <circle cx="81" cy="125" r="11" fill="#4F7FC4"/>
  <circle cx="112" cy="129" r="11" fill="#4F7FC4"/>
  <circle cx="121" cy="96" r="11" fill="#4F7FC4"/>
</svg>
