name: CI

# Every push and every pull request is built and tested. Only main and release
# tags are published: an image for a branch nobody has reviewed is a liability
# rather than a convenience.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# A second push to the same branch makes the first one's result irrelevant.
# Tags are exempt: a release build should never be cancelled by what follows it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  IMAGE_NAME: orknux-server
  # The all-in-one image: the interface, the server and a SQLite file in one
  # container. Built from Dockerfile.one in this same repository, because it
  # contains the server and the two would otherwise be released out of step.
  IMAGE_NAME_ONE: orknux-one

jobs:
  # Both engines, side by side.
  #
  # There are two databases and until now CI ran one of them. The other is the
  # one `orknux-one` ships with, so the engine nobody tested was the engine most
  # people run — and it went red without anybody noticing, twice. #169 was a
  # workspace that could not be deleted, which SQLite refused every time and
  # Postgres allowed every time; #171 was an agent's tools answering
  # `Unable to commit against JDBC Connection` for a minute, on that same engine
  # and nowhere else. Neither could be seen from here.
  #
  # `fail-fast: false` is the point of the matrix rather than a detail of it. The
  # default cancels the surviving leg the moment one fails, which would throw
  # away exactly the comparison being added: what is worth knowing about a red
  # build is whether it is red on both engines or on one.
  build:
    name: Build and test (${{ matrix.engine }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        engine: [postgres, sqlite]

    steps:
      - uses: actions/checkout@v4
      # Docker Hub takes 25,000 bytes of description and not one more. The
      # action that publishes it truncates silently past that and only warns,
      # which would leave the reference ending mid-sentence with the last two
      # sections gone - and nothing red anywhere to say so. Checked here rather
      # than at publish time so it fails on the branch that grew the file,
      # while somebody is still editing it. Both files, since this repository
      # publishes two images and each has a description of its own.
      - name: The Docker Hub descriptions have to fit
        # Once, not once per engine: it weighs two files and the answer cannot
        # depend on which database the suite ran against.
        if: matrix.engine == 'postgres'
        run: |
          limit=25000
          comfortable=24000
          failed=0
          for file in DOCKERHUB.md DOCKERHUB-ONE.md; do
            size=$(wc -c < "$file")
            echo "$file is $size bytes of $limit."
            if [ "$size" -gt "$limit" ]; then
              echo "::error file=$file::$size bytes, and Docker Hub takes $limit. Shorten it by $((size - limit)) bytes, or move a section into README.md and link to it - do not let it be truncated, because the end is where the least-known settings are."
              failed=1
            elif [ "$size" -gt "$comfortable" ]; then
              echo "::warning file=$file::$size bytes, $((limit - size)) short of the $limit Docker Hub allows. Adding another variable or two will break the build - worth shortening now rather than in the middle of a release."
            fi
          done
          exit $failed

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Postgres arrives through Testcontainers, which the runner's Docker
      # daemon provides; SQLite is a file under app/target and needs no daemon
      # at all. `TestDatabase` picks between them before any Spring context
      # exists. The encryption key comes from the surefire configuration in
      # app/pom.xml, so nothing secret is needed to run either.
      - name: Build and test
        run: ./mvnw -B -ntp verify -Dorknux.test.database=${{ matrix.engine }}


      - name: Publish test report
        uses: actions/upload-artifact@v4
        # Reports matter most when the build failed, which is exactly when the
        # step before this one stopped the job.
        if: always()
        with:
          # Named per engine, or the second leg to finish would collide with the
          # first — and the SQLite reports are the ones nobody has been able to
          # read until now.
          name: test-results-${{ matrix.engine }}
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: ignore
          retention-days: 7

  # Does the artefact actually run?
  #
  # The build proves the code compiles and the suite proves it behaves. Neither
  # starts the image — the Dockerfile skips tests deliberately — so a container
  # that could not boot was built, tagged and pushed exactly like one that
  # could, and the first person to run it was whoever pulled it.
  #
  # This runs on every push and every pull request, unlike publish: knowing the
  # image is broken is worth as much on a branch as on main. It found a bean
  # cycle the second time it was run.
  image:
    name: Verify image
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        # The server image builds the interface into its jar since #585, from
        # the submodule. Without this the checkout leaves an empty directory and
        # the build fails on a missing package.json.
        with:
          submodules: true

      - name: Build the image and start it
        run: ./scripts/verify-image.sh

  # And the all-in-one image, which has more to prove.
  #
  # `orknux-one`'s whole claim is that `docker run` with no arguments gives you
  # something you can sign into: it invents its own encryption key, its own
  # database and its own administrator on the way up. None of that is exercised
  # by building it. The failure it can most easily have is silent — a second
  # start that generates a second key boots perfectly and makes every stored
  # credential unreadable — so the script starts it, signs in as the
  # administrator it made up, writes something, restarts it and signs in again.
  image-one:
    name: Verify all-in-one image
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        # The interface is a submodule and this image builds its bundle from
        # source. Without this the checkout leaves an empty directory and the
        # build fails on a missing package.json.
        with:
          submodules: true

      # `bash`, not `./`, because this repository is worked on from Windows as
      # well and git there records no executable bit on a new file.
      - name: Build the image and start it with nothing supplied
        run: bash scripts/verify-one-image.sh

  # And what somebody actually sees.
  #
  # `build` proves the server behaves and `image-one` proves the container
  # starts. Neither opens a browser, and until now nothing in this file did:
  # the interface had thirty end-to-end checks written for it, each one run once
  # by hand and then abandoned, so every regression they were written to catch
  # was free to come back. Two show-stoppers were found by a person clicking
  # around on the evening this job was written.
  #
  # It runs against the all-in-one image rather than a dev server and a seeded
  # database, because that image is the only thing here that needs nothing: it
  # invents its own encryption key, its own SQLite file and its own
  # administrator on the way up, and serves the bundle and the API on one port.
  # So "from nothing" is `docker run`, and the fixture the checks need is built
  # through the API by the same seed the manual's screenshots use.
  browser:
    name: Browser suite
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read

    env:
      # Not 8080: the runner is shared with whatever the other jobs leave about,
      # and a port clash reads as an interface that does not work.
      PORT: '18099'
      BASE: http://localhost:18099

    steps:
      - uses: actions/checkout@v4
        # The interface is a submodule, and both the image's bundle and the
        # checks themselves live in it.
        with:
          submodules: true

      - name: Build the all-in-one image
        run: docker build -f Dockerfile.one -t orknux-one:suite .

      # Nothing but a port and a volume, deliberately.
      #
      # This used to need ORKNUX_ALLOWED_ORIGINS, because the nginx this image
      # carried before #585 forwarded `Host: $host` and dropped the port: the
      # server rebuilt the request's
      # address without it while the browser sent an Origin with it,
      # same-origin looked cross-origin, and every GraphQL call from the page
      # answered 403 while curl - which sends no Origin - was served
      # perfectly. That is fixed at the source now, so setting the variable
      # here would only hide it coming back. If this job starts failing with
      # 403s from the page, that is the bug returning and not a suite
      # problem - which is exactly why a browser check earns its place
      # beside a curl one.
      - name: Start it with nothing but an address
        run: |
          docker run -d --name orknux-one-suite \
            -p ${{ env.PORT }}:8080 \
            -v orknux-one-suite-data:/var/lib/orknux \
            orknux-one:suite
          for _ in $(seq 1 90); do
            if curl -fsS -m 3 "${{ env.BASE }}/api/auth/method" >/dev/null 2>&1; then
              echo "answering"; exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' orknux-one-suite 2>/dev/null)" != "true" ]; then
              docker logs orknux-one-suite 2>&1 | tail -40
              echo "::error::The container exited while starting"; exit 1
            fi
            sleep 2
          done
          docker logs orknux-one-suite 2>&1 | tail -40
          echo "::error::It never answered"; exit 1

      # The account the image invented on the way up. It is written to the data
      # directory and printed in the log; read from the file, because a log is
      # a public artefact on a public runner and this is a password.
      - name: Take the administrator it invented
        run: |
          echo "::add-mask::$(docker exec orknux-one-suite cat /var/lib/orknux/admin-password)"
          {
            echo "ORKNUX_USER=admin"
            echo "ORKNUX_PASSWORD=$(docker exec orknux-one-suite cat /var/lib/orknux/admin-password)"
            echo "ORKNUX_UI_URL=${{ env.BASE }}"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: orknux-ui/package-lock.json

      - name: Install the interface's dependencies and a browser
        working-directory: orknux-ui
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # The workspace the checks are written against: a model, a connection,
      # functions, tools, conditions, actions, agents, two workflows with nodes
      # and lines in them, runs, and a tracker with issues in it. The same seed
      # the manual is photographed against, so the two cannot drift apart.
      #
      # The model it configures cannot be reached from a runner and the seed
      # says so and carries on. Nothing in the CI suite asks a model anything -
      # see `ci: false` in scripts/suite/suite.mjs for the one that does.
      - name: Build the fixture
        working-directory: orknux-ui
        run: node scripts/seed-demo.mjs

      # And a second copy, because the suite runs two checks at a time and two
      # checks cannot share a workspace: one makes a function the other is
      # counting, one publishes a workflow the other is reading. A copy per
      # worker is what makes the run parallel at all - see the `--jobs 2` below.
      #
      # Two and not four. The runner is building and running the all-in-one
      # image beside this, and each worker is a chromium; the second one roughly
      # halves the wall clock, and the third is where a 7GB runner starts
      # swapping. Issue #308.
      - name: Build a second copy of it, for the second worker
        working-directory: orknux-ui
        run: ORKNUX_SUITE_SHARD=2 node scripts/seed-demo.mjs

      # Which ids it got. A database built from nothing does not hand out the
      # same numbers as the developer's, so the checks are pointed at what the
      # seed actually made rather than at the numbers they were written with.
      - name: Work out what the ids are
        working-directory: orknux-ui
        run: node scripts/suite/fixture.mjs >> "$GITHUB_ENV"

      # What the checks took last time, so the runner can put the cheap ones
      # first and a broken build says so early rather than forty minutes in.
      # Restored best-effort: with no cache the run is in declaration order,
      # which is exactly what it was before. Issue #308.
      - name: What the checks cost last time
        uses: actions/cache@v4
        with:
          path: orknux-ui/scripts/suite/results/timings.json
          key: browser-suite-timings-${{ github.run_id }}
          restore-keys: browser-suite-timings-

      # `--jobs 2` rather than one at a time. Each worker takes the next check
      # off a shared queue and runs it against its own copy of the fixture, so
      # the cheap ones still go first and no worker is left holding the long
      # tail. The two checks that change something the whole installation shares
      # - chat switched off, and alice reading Polish - are marked `alone` in
      # suite.mjs and the runner drains the other worker before starting them.
      - name: Run the browser suite
        working-directory: orknux-ui
        run: node scripts/suite/run.mjs --ci --jobs 2

      # Reports matter most when the job failed, which is when the step above
      # stopped it - the same reason the server's suite uploads its own.
      - name: Publish the report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-suite-results
          path: |
            orknux-ui/scripts/suite/results/*.xml
            orknux-ui/scripts/suite/shots/*
          if-no-files-found: ignore
          retention-days: 7

      # What the server made of it, for a failure that is not the interface's.
      - name: What the server said
        if: failure()
        run: docker logs orknux-one-suite 2>&1 | tail -100

  publish:
    name: Publish image
    runs-on: ubuntu-latest
    # Both: the suite has to pass and the image has to start before anything is
    # published. Nothing reaches the registry unstarted.
    needs: [build, image]
    # Never from a pull request: a fork's pull request must not be able to reach
    # the registry credentials, and an unmerged change has nothing to publish.
    #
    # And not at all where those credentials have not been set — a fork, or this
    # repository before somebody adds them. Skipped is the honest result: a red
    # run says the build is broken, and a missing variable is not that.
    if: github.event_name == 'push' && vars.DOCKERHUB_USERNAME != ''

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        # The interface is a submodule and this image builds its bundle into
        # the jar since #585.
        with:
          submodules: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # latest follows main; a vX.Y.Z tag also publishes X.Y.Z and X.Y so a
      # deployment can pin as loosely or as tightly as it wants. Every build is
      # tagged with its commit as well, which is the only tag that never moves.
      #
      # Matched rather than parsed as semver. A patch on a released line is
      # numbered 0.9.8.1, which has four parts and is therefore not semver at
      # all: `type=semver` quietly produced no version tag for it, so the job
      # went green having published an image nobody could pin to. A pattern that
      # takes what follows the `v` works for both shapes.
      - name: Work out tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=match,pattern=v(.*),group=1
            type=match,pattern=v(\d+\.\d+),group=1
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The layer cache lives in the registry, so a build reuses what the
          # last one resolved instead of downloading the dependency tree again.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # And the repository description, which until now was a file somebody
      # remembered to paste into a web form. DOCKERHUB.md claims to list every
      # environment variable this image reads; a claim that is true in git and
      # eleven variables out of date on Docker Hub is worse than no claim, and
      # an operator planning an upgrade reads the one on Docker Hub.
      #
      # Last, and after the push, so a description that fails to update cannot
      # stop the image being published - the images are the release, and this
      # is the page beside them. It goes red, which is the point.
      #
      # The token needs read, write *and* delete: updating a description is not
      # a push, and a token scoped only to push answers 401 here while working
      # perfectly in the step above.
      - name: Update the Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          # A token of its own, if there is one, because this is the only step
          # here that needs delete scope - see the note above - and the push
          # above should not be carrying it. Falls back to the token that
          # pushes, which then has to be the wider one.
          password: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN || secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          readme-filepath: ./DOCKERHUB.md

  # The all-in-one image, published beside the other one and on the same terms.
  #
  # Its own job rather than another step in `publish`, so the two images do not
  # hold each other up: one that fails to start should not stop the other
  # reaching the registry. Same tags, same conditions, same credentials.
  publish-one:
    name: Publish all-in-one image
    runs-on: ubuntu-latest
    # The suite has to pass and this image has to start with nothing supplied.
    needs: [build, image-one]
    # Never from a pull request, and not at all where the registry credentials
    # have not been set. See the job above for why skipped is the honest result.
    if: github.event_name == 'push' && vars.DOCKERHUB_USERNAME != ''

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        # The interface is a submodule and this image builds its bundle.
        with:
          submodules: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The same scheme as the server image, so a person can pin both to one
      # version: latest follows main, a vX.Y.Z tag also publishes X.Y.Z and X.Y,
      # and every build is tagged with its commit, which is the tag that never
      # moves. Matched rather than parsed as semver, for the reason written
      # against the server image above: 0.9.8.1 has four parts.
      - name: Work out tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME_ONE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=match,pattern=v(.*),group=1
            type=match,pattern=v(\d+\.\d+),group=1
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.one
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A cache scope of its own. The two Dockerfiles build the same jar but
          # end in different images, and sharing the default scope would have
          # each build evicting the other's layers.
          cache-from: type=gha,scope=one
          cache-to: type=gha,mode=max,scope=one

      # Last, and after the push, so a description that fails to update cannot
      # stop the image being published. DOCKERHUB-ONE.md is where the caveats
      # are written down - no durable runs, no directory, one writer - and those
      # are the part somebody has to read before they mistake this for a
      # deployment.
      - name: Update the Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN || secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME_ONE }}
          readme-filepath: ./DOCKERHUB-ONE.md

  # The signed server jar a running installation updates itself from (#584).
  #
  # Tags only: a jar is a release, and an installation shown one from a branch
  # nobody reviewed would be offered exactly what the images refuse to publish.
  # Built as the images build theirs - the interface inside, -Pwith-ui - then
  # signed with the release key, whose public half every image pins
  # (app/src/main/resources/release/orknux-release.pem) and refuses anything
  # else by. A tag build without the key fails rather than publishing an
  # unsigned jar: no installation would accept one, and finding that out from
  # an administrator's Update button is the wrong place.
  release-jar:
    name: Sign and publish the server jar
    runs-on: ubuntu-latest
    needs: [build, image, image-one]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      # To attach the jar to the GitHub release.
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: orknux-ui/package-lock.json

      - name: Build the interface
        working-directory: orknux-ui
        run: |
          npm ci --no-fund --no-audit
          npm run build

      - name: Build the jar
        run: ./mvnw -B -ntp package -DskipTests -Pwith-ui

      - name: Sign it, and check it is signed by the key every image pins
        id: jar
        env:
          KEYSTORE: ${{ secrets.ORKNUX_RELEASE_KEYSTORE }}
          STOREPASS: ${{ secrets.ORKNUX_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STOREPASS" ]; then
            echo "::error::ORKNUX_RELEASE_KEYSTORE and ORKNUX_RELEASE_KEYSTORE_PASSWORD are required on a release tag; an unsigned jar is one no installation will accept."
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          built="app/target/orknux-app-$version.jar"
          [ -f "$built" ] || { echo "::error::$built was not built - does the tag match the version in pom.xml?"; exit 1; }
          signed="orknux-server-$version.jar"

          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.p12"
          jarsigner -keystore "$RUNNER_TEMP/release.p12" -storetype PKCS12 -storepass:env STOREPASS \
            -signedjar "$signed" "$built" orknux-release
          rm -f "$RUNNER_TEMP/release.p12"

          jarsigner -verify "$signed" | tee "$RUNNER_TEMP/verify.txt"
          grep -q '^jar verified' "$RUNNER_TEMP/verify.txt" || { echo "::error::jarsigner did not verify $signed"; exit 1; }
          pinned="$(keytool -printcert -file app/src/main/resources/release/orknux-release.pem | grep -m1 'SHA256:')"
          signer="$(keytool -printcert -jarfile "$signed" | grep -m1 'SHA256:')"
          [ -n "$pinned" ] && [ "$pinned" = "$signer" ] \
            || { echo "::error::$signed is signed by $signer, and the images pin $pinned"; exit 1; }

          # That version's section of the changelog, without its heading.
          awk -v heading="## $version" '$0 == heading { found = 1; next } found && /^## / { exit } found' CHANGELOG.md \
            > "$RUNNER_TEMP/changelog.md"
          {
            echo "file=$signed"
            echo "version=$version"
            echo "sha256=$(sha256sum "$signed" | cut -d' ' -f1)"
            echo "size=$(stat -c %s "$signed")"
          } >> "$GITHUB_OUTPUT"

      - name: Attach it to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/changelog.md"
          gh release upload "$GITHUB_REF_NAME" "${{ steps.jar.outputs.file }}" --clobber

      # Two steps, because orknux.ai sits behind Cloudflare, which refuses a
      # request body over 100 MB and a jar is three times that: the release is
      # announced with its hash and size, then its bytes go up in pieces, each
      # at the offset the site says it has received up to - so a run that is
      # retried carries on where the last one stopped.
      - name: Offer it through orknux.ai
        env:
          TOKEN: ${{ secrets.ORKNUX_AI_PUBLISH_TOKEN }}
          FILE: ${{ steps.jar.outputs.file }}
          VERSION: ${{ steps.jar.outputs.version }}
          SHA256: ${{ steps.jar.outputs.sha256 }}
          SIZE: ${{ steps.jar.outputs.size }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::ORKNUX_AI_PUBLISH_TOKEN is not set, so $VERSION is not offered through orknux.ai; it is on the GitHub release."
            exit 0
          fi
          site="https://orknux.ai/api/server-releases"
          answer="$(curl -fsS -X POST "$site" -H "Authorization: Bearer $TOKEN" \
            -F "version=$VERSION" -F "sha256=$SHA256" -F "size=$SIZE" -F "changelog=<$RUNNER_TEMP/changelog.md")"
          piece=$((90 * 1024 * 1024))
          while [ "$(jq -r '.published' <<<"$answer")" != "true" ]; do
            offset="$(jq -r '.received' <<<"$answer")"
            [ "$offset" -lt "$SIZE" ] || { echo "::error::orknux.ai has every byte and has not published: $answer"; exit 1; }
            dd if="$FILE" of="$RUNNER_TEMP/piece" iflag=skip_bytes,count_bytes skip="$offset" count="$piece" status=none
            answer="$(curl -fsS -X PUT "$site/$VERSION/jar?offset=$offset" -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/octet-stream' --data-binary "@$RUNNER_TEMP/piece")"
            echo "orknux.ai has $(jq -r '.received' <<<"$answer") of $SIZE bytes"
          done
          echo "$VERSION is offered through orknux.ai: $(jq -r '.jarUrl' <<<"$answer")"
