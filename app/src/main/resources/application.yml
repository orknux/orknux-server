# Every value an operator would want to change reads from the environment, with the
# development default beside it: `${ORKNUX_SOMETHING:default}`.
#
# Spring would let any property be overridden by a variable derived from its path,
# but a derived name is one nobody can look up and one that changes when a property
# moves. These are named, stable, and all prefixed the same way, so `env | grep
# ORKNUX_` is the whole of an installation's configuration.
#
# What is deliberately not settable: the schema validation mode, Flyway's own
# locations, and Spring AI's schema initialisation. Those are invariants this
# application is built around rather than choices — changing one does not configure
# the server, it breaks it.

spring:
  servlet:
    multipart:
      # A recording, not a document. The default cap is 1MB — a few seconds of
      # speech — and the endpoint refuses anything past 25MB itself, with a
      # sentence rather than a stack trace.
      max-file-size: ${ORKNUX_UPLOAD_MAX_FILE_SIZE:25MB}
      max-request-size: ${ORKNUX_UPLOAD_MAX_REQUEST_SIZE:26MB}
  ai:
    chat:
      memory:
        repository:
          jdbc:
            # Flyway owns this schema, so Spring AI must not create its own
            # table; V31 creates it exactly as the starter declares it.
            initialize-schema: never
  application:
    name: orknux-server
  mvc:
    async:
      # How long a request that answered with a promise may stay open before the
      # container gives up on it. The container's own default is thirty seconds,
      # which is shorter than the five minutes `orknux_news` may be asked to
      # wait - so a wait would have been cut off by the machinery that makes it
      # cost nothing. Longer than the longest wait, with slack.
      request-timeout: ${ORKNUX_ASYNC_REQUEST_TIMEOUT:330s}
  datasource:
    # Which database this installation keeps its state in, said the only way that
    # cannot disagree with itself: the URL. Postgres and SQLite are both
    # supported, and everything downstream - the driver, the Hibernate dialect,
    # which set of migrations Flyway reads - is worked out from this one line
    # rather than configured beside it.
    #
    #   jdbc:postgresql://host:5432/orknux   a server, and what a deployment wants
    #   jdbc:sqlite:/var/lib/orknux/orknux.db   a file, and nothing else to run
    #
    # SQLite is for the installation of one, or few: it is a file on a disk, so
    # there is no second container and no password, but it is also one writer at
    # a time and it lives on whichever machine holds that file. Read **The
    # database** in the README before choosing it - some things this server does
    # are weaker there, and the list is short but real.
    url: ${ORKNUX_DB_URL:jdbc:postgresql://localhost:5432/orknux}
    # Both empty under SQLite; a file has nobody to authenticate to.
    username: ${ORKNUX_DB_USERNAME:orknux}
    password: ${ORKNUX_DB_PASSWORD:orknux}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    # Off only where something else owns the schema; the application expects it
    # to be at the version this build ships.
    enabled: ${ORKNUX_DB_MIGRATE:true}
    # One directory per database, chosen by Flyway from the connection it is
    # given. They are not two spellings of one history: Postgres has every
    # migration since the first release, and SQLite has a single baseline that
    # says what they all add up to. See db/migration/sqlite/V1__baseline.sql for
    # why, and what it costs.
    locations: classpath:db/migration/{vendor}
  ldap:
    urls: ${ORKNUX_LDAP_URLS:ldap://localhost:389}
    base: ${ORKNUX_LDAP_BASE:dc=orknux,dc=io}
    username: ${ORKNUX_LDAP_BIND_DN:cn=admin,dc=orknux,dc=io}
    password: ${ORKNUX_LDAP_BIND_PASSWORD:admin}

logging:
  level:
    # Two knobs rather than one, because the useful question is almost always
    # "more from this application" and almost never "more from Hibernate". Set
    # ORKNUX_LOG_LEVEL to DEBUG and what gets louder is the code that decides
    # things here - triggers firing, providers being called, tasks handed over -
    # while the frameworks stay where they were. ORKNUX_LOG_LEVEL_ROOT is there
    # for the other afternoon, when the thing that is wrong is underneath.
    root: ${ORKNUX_LOG_LEVEL_ROOT:INFO}
    io.mszymanski.orknux: ${ORKNUX_LOG_LEVEL:INFO}
    # What a workspace's own functions and plugins say, under loggers of their
    # own so they can be turned up without the server getting louder with them.
    # This decides where those lines *go*; script.log-level below decides
    # whether they are written at all, inside the sandbox.
    io.mszymanski.orknux.script: ${ORKNUX_SCRIPT_LOG:INFO}
    io.mszymanski.orknux.plugin: ${ORKNUX_PLUGIN_LOG:INFO}
  logback:
    rollingpolicy:
      # Only consulted when a file is being written. A log that grows without
      # bound fills the disk it shares with the database.
      max-file-size: ${ORKNUX_LOG_MAX_FILE_SIZE:10MB}
      max-history: ${ORKNUX_LOG_MAX_HISTORY:14}
      total-size-cap: ${ORKNUX_LOG_TOTAL_SIZE_CAP:1GB}

server:
  port: ${ORKNUX_PORT:8080}
  servlet:
    session:
      # How long a session survives without being used. Boot's default is 30
      # minutes, which is a length of time somebody can spend reading a page — and
      # being signed out for having read carefully is a poor lesson to teach.
      #
      # A fortnight is chosen for a self-hosted tool behind an identity provider:
      # the provider is where a leaver is disabled, and this is not the lock keeping
      # anybody out. Shorten it where that is not true.
      timeout: ${ORKNUX_SESSION_TIMEOUT:14d}
      cookie:
        # Strict where the interface is served from this origin and nothing links
        # into it; lax is what lets a link from elsewhere arrive signed in.
        same-site: ${ORKNUX_SESSION_COOKIE_SAME_SITE:lax}
        http-only: ${ORKNUX_SESSION_COOKIE_HTTP_ONLY:true}

management:
  endpoints:
    web:
      exposure:
        # Metrics and nothing else. Actuator ships a dozen endpoints and Boot
        # exposes health by default; each one here is a page about this
        # installation reachable over the same port as the interface, so the list
        # is what is asked for rather than what happens to be switched on.
        #
        # Health is deliberately not among them. This server already answers for
        # its own health twice: the monitoring screen names every dependency it
        # has, and the container's health check reads /api/auth/method, which is
        # open by design and needs no credential. A third answer would be one
        # more surface for nothing.
        #
        # Everything not listed is unmapped rather than merely refused, so
        # /actuator/env and the rest are 404 for everybody, whatever they hold.
        include: prometheus

db-scheduler:
  # The clock behind scheduled triggers. It keeps its state in the database, so
  # one instance fires a schedule however many are running.
  enabled: ${ORKNUX_SCHEDULER_ENABLED:true}
  threads: ${ORKNUX_SCHEDULER_THREADS:4}
  polling-interval: ${ORKNUX_SCHEDULER_POLLING_INTERVAL:10s}
  # How often the scheduled triggers are looked at, and so the finest schedule
  # this installation can keep. A cron of seconds is accepted whatever this
  # says; it fires in bursts of whatever came due since the last tick, so
  # lowering this is what turns a schedule of seconds into one that actually
  # runs every few seconds. Every tick is a query per enabled scheduled trigger.
  tick-interval: ${ORKNUX_SCHEDULER_TICK_INTERVAL:10s}

orknux:
  # Filled in from the build, and reported on the monitoring screen.
  version: "@project.version@"
  marketplace:
    # Where the plugin catalog is read from. This server holds no catalog of
    # its own: it asks, and installs from the URL the answer carries. Blank
    # leaves the Catalog screen saying this installation has no marketplace,
    # which is the honest state for an air-gapped one.
    url: ${ORKNUX_MARKETPLACE_URL:https://orknux.ai/graphql}
    # What this installation says to be answered at all. The marketplace keys
    # both its doors - the catalog query and the plugin files - and refuses
    # anything without it; what travels is a HMAC of the day over this, never
    # this.
    #
    # Written here on purpose, and it is not a leak. It is a deterrent against
    # crawlers, not access control: orknux-server is self-hosted, so every
    # installation able to install a plugin already holds this value, and a
    # secret every reader has is not one a repository could keep. What it buys
    # the marketplace is that a crawler has to be pointed at this file rather
    # than at a URL, which is the whole of what it was ever for.
    #
    # So: nothing may be built on top of it that assumes the caller is
    # trusted, and it must never be described to a user as access control. The
    # marketplace vouches for nothing about a plugin either - what one asks to
    # be allowed is still read from its code, in the sandbox, at the moment
    # somebody accepts it. Override it per installation if you have your own.
    install-key: ${ORKNUX_INSTALL_KEY:7444beb07c53a65ed81074f73cdeec6defeecced280e1ee6d866a95a6f69ac72}
  chat:
    # Whether this installation has a chat at all. False here is final: an
    # administrator can turn the chat off from the screen, but not back on
    # where the operator has said no.
    enabled: ${ORKNUX_CHAT_ENABLED:true}
    # How many rounds of tool calls an agent gets before it has to answer. One
    # call to the model is a round: it answers, or it asks for tools and what it
    # asks for is run and handed back. This is where a fresh installation
    # starts; Admin -> Settings is the switch and what it holds wins, and an
    # agent may carry its own number on its page.
    max-rounds: ${ORKNUX_CHAT_MAX_ROUNDS:8}
  attachments:
    # Whether a chat may carry files at all. False here is final: an
    # administrator can turn attachments off from the screen, but not back on
    # where the operator has said no — the disk belongs to whoever runs this.
    enabled: ${ORKNUX_ATTACHMENTS_ENABLED:true}
    # Where the bytes go. FILESYSTEM is the only one today; object storage
    # would be a second class behind the same interface, not a flag here.
    storage: FILESYSTEM
    # One directory per workspace is created under this. Relative resolves
    # against the working directory, which is fine on a development machine and
    # wrong in a container: name a volume that outlives the process.
    location: ${ORKNUX_ATTACHMENTS_LOCATION:data/attachments}
    max-file-size-mb: ${ORKNUX_ATTACHMENTS_MAX_FILE_SIZE_MB:25}
  revision:
    # How many days of a component's history are kept.
    #
    # A version of a function, tool, skill or agent is a whole copy of what it
    # was before a save - the source, the parameters, the prompt - so this is
    # the number that decides how much disk that table takes. Fourteen days.
    #
    # This is where a fresh installation starts, not the last word: it is also a
    # field on the Admin screen, and once an administrator has set it theirs is
    # the answer. The sweep reads it on every pass, so changing it needs no
    # restart.
    retention-days: ${ORKNUX_REVISION_RETENTION_DAYS:14}
    # False sweeps nothing on a timer; nothing is deleted until it is turned
    # back on. The suite sets it and calls the sweep itself.
    sweep-enabled: ${ORKNUX_REVISION_SWEEP_ENABLED:true}
    sweep-interval: ${ORKNUX_REVISION_SWEEP_INTERVAL:6h}
  logging:
    # Console always. Name a file here and it is written to as well — an
    # absolute path in a deployment, since the working directory of a container
    # is not somewhere anyone goes looking. Empty means console only.
    file: ${ORKNUX_LOG_FILE:}
    # plain reads well in a terminal; json (one ECS object per line) is what a
    # collector wants. Applies to the console and the file alike: two formats at
    # once would mean two answers to "what did it log".
    format: ${ORKNUX_LOG_FORMAT:plain}
  metrics:
    # Whether /actuator/prometheus answers somebody who has not signed in.
    #
    # False, because what it renders describes the installation and not merely
    # the machine: how many workspaces there are, how often workflows run, how
    # often they fail, and which models are configured. Left open on a public
    # address that is a free and continuously updated account of somebody's
    # estate, and none of it is anything they asked to publish.
    #
    # Off costs a scraper very little - Prometheus can carry an Authorization
    # header, and an API token is read on every request like any other caller's.
    # True is for the deployment where the metrics are scraped over a network
    # only the scraper is on, and where a credential in the scrape config would
    # be ceremony over a wire nobody else can reach. Nothing else under
    # /actuator is opened by it.
    #
    # This is where a fresh installation starts, not the last word: it is also a
    # switch on the Admin screen, and once an administrator has pressed it theirs
    # is the answer. Not the floor the other installation settings get, because
    # here the file's default is already the closed answer - a floor under it
    # would mean the switch could never be pressed at all. The decision is read
    # per scrape, so pressing it needs no restart, and the audit log says who.
    anonymous: ${ORKNUX_METRICS_ANONYMOUS:false}
  web:
    # Where the interface is served from, when it is not this server. Comma
    # separated; empty allows none, which is right once they share an origin.
    allowed-origins: ${ORKNUX_ALLOWED_ORIGINS:http://localhost:5173}
    # Where this installation is reached from, as somebody's browser spells it.
    # Set this in a deployment: it is what a mailed password reset link points at,
    # and the development default below points at the Vite server.
    #
    # It is configured rather than worked out from the request because the Host
    # header is written by whoever is calling - a link built from it is a link an
    # attacker chooses the address of, and the link in question opens an account.
    # Empty means no link can be written and none is sent; the log says so.
    base-url: ${ORKNUX_BASE_URL:http://localhost:5173}
  webhook:
    # The most a webhook caller may send. This endpoint is open to the internet
    # by necessity - a build server cannot sign in - and the body it posts is
    # kept several times over on the way to becoming a run's input, so its size
    # is the one thing an anonymous caller must not get to choose. A megabyte is
    # far past any real webhook; raise it where a sender genuinely posts more.
    # Anything larger is refused with 413 and never reaches a trigger.
    max-body-size: ${ORKNUX_WEBHOOK_MAX_BODY_SIZE:1MB}
  mail:
    # The mail server this installation sends its own mail through: the password
    # reset link, and issue notifications for anybody who has not turned them off.
    #
    # Not a workspace's SMTP connection, deliberately. Those exist so a team's
    # workflows can send from the team's address with a credential a workspace
    # administrator pasted in; a password reset is the installation writing to
    # somebody about their account, has to work for a person who belongs to no
    # workspace, and must not stop working the day one team rotates a password.
    #
    # Empty host or from means this installation cannot send its own mail. That is
    # a supported state rather than a misconfiguration - it simply cannot offer a
    # password reset, and rings the tracker's bell without also posting it. It
    # says so in the log rather than borrowing somebody's relay. Set both to turn
    # sending on; each person then decides for themselves, under Preferences,
    # whether their notifications are posted as well as shown.
    host: ${ORKNUX_MAIL_HOST:}
    # Empty takes whatever the security below usually listens on: 587 for
    # STARTTLS, 465 for TLS, 25 for none.
    port: ${ORKNUX_MAIL_PORT:}
    # Empty sends without authenticating, which is what an internal relay on the
    # same network usually wants.
    username: ${ORKNUX_MAIL_USERNAME:}
    password: ${ORKNUX_MAIL_PASSWORD:}
    # What the mail is from. A relay will not take a message without one.
    from: ${ORKNUX_MAIL_FROM:}
    # NONE, STARTTLS or TLS. STARTTLS is required rather than merely offered -
    # a server that has stopped offering it is refused rather than quietly
    # receiving the password in the clear.
    security: ${ORKNUX_MAIL_SECURITY:STARTTLS}
  bootstrap-admin:
    # The first administrator, for an installation that has no directory and no
    # OIDC provider to sign in against. Without this such an installation cannot
    # be entered at all: an account is made by an administrator or written down
    # when a provider vouches for somebody, so there is nobody to create the
    # administrator who could create you.
    #
    # Both empty, which is right wherever a provider exists - the people are the
    # provider's, and an account made here would be a second way in that its
    # policies do not reach.
    #
    # Only ever creates. A user of this name that already exists is left exactly
    # as it is, password and roles alike, so a variable still set on the tenth
    # restart cannot put back a password somebody changed or a role somebody
    # deliberately took away. The password has to meet the same minimum as any
    # other; a shorter one seeds nobody and says so.
    #
    # A password in a variable is readable by anything that can see this
    # process's environment and sits in whatever file the variables were written
    # into. It is a way in, not a credential to keep: sign in, change it from
    # inside, then unset both of these.
    username: ${ORKNUX_BOOTSTRAP_ADMIN_USERNAME:}
    password: ${ORKNUX_BOOTSTRAP_ADMIN_PASSWORD:}
  security:
    # Sees the Admin section and every workspace.
    # LDAP, INTERNAL, OIDC or NONE. One at a time, deliberately: two would mean an LDAP
    # password for every account the OIDC provider governs — a second way in that
    # its policies do not reach and its administrators do not know about.
    #
    # OIDC covers two flows at once. A browser is sent to the provider and comes
    # back with a code, which this server exchanges for the same session cookie
    # password sign-in issues; a script presents the provider's token as a bearer
    # instead, validated per request. Same provider, same claims, same roles.
    #
    # INTERNAL is username and password against the accounts this installation
    # holds itself, with nothing outside it involved. It is what the all-in-one
    # image sets, because that image ships no directory: under LDAP it announced
    # single sign-on on the sign-in card and reported itself degraded for failing
    # to reach a localhost:389 nobody had asked for. Under INTERNAL no directory
    # is contacted, and the monitoring screen draws no card for one.
    #
    # NONE turns authentication off. Nobody signs in, no screen asks, and every
    # request that reaches this server acts as one identity - "everyone" - which
    # holds the built-in administrator role. Anyone who can reach the port
    # administers the installation, reads every workspace and can use every stored
    # credential, so it belongs only where something else is already the gate: a
    # laptop somebody is trying the product on, a VPN, an authenticating proxy.
    #
    # It cannot be arrived at by accident, which is the point of it being a name
    # rather than a switch. Unset is LDAP, empty is LDAP, and any other value fails
    # to bind and stops the application before it answers a request - it does not
    # fall back to anything. And it is never quiet about itself: the log says so at
    # startup, the Doctor screen says so, and the interface draws it across the top
    # of every page.
    #
    # The default is LDAP and stays LDAP. This says what an installation has, and
    # changing the default would change what every existing one claims to have -
    # and with NONE among the values, the default has to be the closed one.
    auth-method: ${ORKNUX_AUTH_METHOD:LDAP}
    admin-role: ${ORKNUX_ADMIN_ROLE:ROLE_ADMINS}
    sign-in:
      # How hard somebody may try. Sign-in is the one door anybody may knock on,
      # and a known username could be tried at whatever rate the network allowed
      # - which under LDAP landed on the directory as well.
      #
      # A wrong password costs nothing until the allowance is spent, then a pause
      # that doubles up to the ceiling and stops there. Nothing here locks
      # anybody out: the pause has an end, a successful sign-in clears the
      # record, and so does going quiet for forget-after. Both counts are kept,
      # because per username alone does not slow a list of names and per address
      # alone does not slow a botnet.
      per-username: ${ORKNUX_SIGN_IN_PER_USERNAME:5}
      # Higher, since an address is not a person: an office behind one router is
      # one address.
      per-address: ${ORKNUX_SIGN_IN_PER_ADDRESS:20}
      first-wait: ${ORKNUX_SIGN_IN_FIRST_WAIT:2s}
      longest-wait: ${ORKNUX_SIGN_IN_LONGEST_WAIT:5m}
      forget-after: ${ORKNUX_SIGN_IN_FORGET_AFTER:15m}
    password-reset:
      # How long a mailed reset link works for. An hour: the link is a secret
      # sitting in a mailbox, in the mail server's copy of it and on whatever
      # phone synchronised it, so what matters is not how long a person needs but
      # how long that copy stays dangerous. Long enough for a slow relay and a
      # spam folder checked on the second look, dead well before anybody goes
      # reading old mail.
      expiry: ${ORKNUX_PASSWORD_RESET_EXPIRY:1h}
      # How hard the forgotten-password form may be knocked on. The same rules as
      # sign-in above and counted separately, so asking about somebody repeatedly
      # cannot put them into a pause on the sign-in page. Tighter per address
      # asked about, because asking for a reset is something a person does once.
      throttle:
        per-username: ${ORKNUX_PASSWORD_RESET_PER_EMAIL:3}
        per-address: ${ORKNUX_PASSWORD_RESET_PER_ADDRESS:20}
        first-wait: ${ORKNUX_PASSWORD_RESET_FIRST_WAIT:2s}
        longest-wait: ${ORKNUX_PASSWORD_RESET_LONGEST_WAIT:5m}
        forget-after: ${ORKNUX_PASSWORD_RESET_FORGET_AFTER:15m}
    oidc:
      # The claim carrying group or role membership. There is no standard one:
      # Keycloak and Okta usually say groups, Entra says groups or roles. Each value
      # in it is treated the way an LDAP group is — looked up in role-mapping below,
      # or matched against a role's own name.
      roles-claim: ${ORKNUX_OIDC_ROLES_CLAIM:groups}
      # What to show as somebody's name; the subject is the fallback, being stable
      # and unreadable.
      username-claim: ${ORKNUX_OIDC_USERNAME_CLAIM:preferred_username}
      # What the sign-in button says, in the words the people signing in use.
      display-name: ${ORKNUX_OIDC_DISPLAY_NAME:single sign-on}
      # The provider. The issuer alone is enough: its own discovery document says
      # where the authorization, token and userinfo endpoints are and which keys
      # sign its tokens, so none of that is written here to go stale.
      #
      # Read only when auth-method is OIDC. Under LDAP these stay empty and nothing
      # looks at them — which is why they live here rather than under spring.security,
      # where an empty registration would fail the whole application at startup.
      issuer: ${ORKNUX_OIDC_ISSUER:}
      client-id: ${ORKNUX_OIDC_CLIENT_ID:}
      client-secret: ${ORKNUX_OIDC_CLIENT_SECRET:}
      # Which audiences a bearer token may name. Empty means the client id, which is
      # what a provider writes into a token minted for this application. Set it when
      # the provider says something else: Keycloak names account unless an audience
      # mapper is configured against this client, Entra names the App ID URI. A token
      # has to match one of these, not all of them.
      audiences: ${ORKNUX_OIDC_AUDIENCES:}
      scopes: ${ORKNUX_OIDC_SCOPES:openid,profile,email,groups}
    # Which of the identity provider's names grants which of this installation's
    # roles. The key is what the provider says — an LDAP group DN or its common
    # name, or the value of an OIDC claim; the value is a role's name as the Roles
    # screen spells it. Both sides are matched without regard to case.
    #
    # Empty is a working configuration rather than an unfinished one: a role with no
    # mapping is granted to whoever holds an authority derived from its own name,
    # which is what LDAP produced before roles existed. So an installation upgrading
    # into roles keeps working with nothing written here.
    #
    # YAML only, deliberately. These keys are group DNs and claim values — full of
    # dots, equals signs and commas — and the environment-variable spelling of one
    # is not something anybody should have to work out.
    #
    #   role-mapping:
    #     "cn=backend,ou=groups,dc=orknux,dc=io": Backend
    #     "platform-admins": Administrators
    role-mapping: {}
    # Encrypts the credentials this server is trusted with — provider keys,
    # Slack tokens, MCP secrets — so the database on its own is not enough to
    # read them. 32 bytes, base64: `openssl rand -base64 32`.
    #
    # Deliberately no default. A key committed here would be a key every
    # installation shares, which is the same as no key at all. Set it in the
    # environment; lose it and the stored credentials cannot be recovered, only
    # entered again.
    secret-key: ${ORKNUX_SECRET_KEY:}
  ldap:
    user-search-base: ${ORKNUX_LDAP_USER_SEARCH_BASE:ou=people}
    user-search-filter: ${ORKNUX_LDAP_USER_SEARCH_FILTER:(uid={0})}
    # Workspace groups have to live under this base for membership to be picked up;
    # point it at the OU that holds them (an empty value disables group search).
    group-search-base: ${ORKNUX_LDAP_GROUP_SEARCH_BASE:ou=groups}
    group-search-filter: ${ORKNUX_LDAP_GROUP_SEARCH_FILTER:(member={0})}
  connection:
    # A connection check calls the configured URL; these bound what that may do.
    probe-timeout-seconds: ${ORKNUX_CONNECTION_PROBE_TIMEOUT_SECONDS:5}
    # How long a workflow's own HTTP request may take. Longer than a probe's: that
    # only asks whether anything is listening, while this is doing work at the other
    # end. Bounded anyway — a step that never returns holds the run that made it.
    request-timeout-seconds: ${ORKNUX_HTTP_REQUEST_TIMEOUT_SECONDS:30}
    # Link-local addresses reach cloud instance metadata. Private and loopback
    # addresses stay reachable, since internal services are the point.
    allow-link-local: ${ORKNUX_CONNECTION_ALLOW_LINK_LOCAL:false}
    # Where an Entra ID token is asked for. The worldwide cloud, which is where
    # all but a few tenants live - the sovereign clouds answer on addresses of
    # their own, and a tenant in one of those cannot reach this. Written down
    # here rather than left to the default in the code, because a setting only
    # reachable by a name Spring derives is a setting nobody can look up.
    entra-authority: ${ORKNUX_CONNECTION_ENTRA_AUTHORITY:https://login.microsoftonline.com}
    check:
      # The same argument as the model providers: a status on the screen should
      # be one that was true recently, not whenever somebody last pressed a
      # button — and "Not checked" should not outlive the save that caused it.
      enabled: ${ORKNUX_CONNECTION_CHECK_ENABLED:true}
      interval: ${ORKNUX_CONNECTION_CHECK_INTERVAL:5m}
      initial-delay: ${ORKNUX_CONNECTION_CHECK_INITIAL_DELAY:30s}
  slack:
    # Opens one Socket Mode websocket per Slack connection that holds an
    # app-level token, and turns arriving mentions into workflow runs.
    enabled: ${ORKNUX_SLACK_ENABLED:true}
    # How often the open sockets are compared with the stored connections, so a
    # token pasted into the settings form starts listening without a restart.
    reconcile-seconds: ${ORKNUX_SLACK_RECONCILE_SECONDS:30}
    # How long a connection Slack refused is left alone; changing the token
    # clears the wait, so a corrected credential is not held back by it.
    retry-failed-seconds: ${ORKNUX_SLACK_RETRY_FAILED_SECONDS:300}
  script:
    # A workspace's JavaScript runs in a GraalJS sandbox with no host access, no
    # files, no network and no threads. These bound what it can spend.
    timeout-millis: ${ORKNUX_SCRIPT_TIMEOUT_MILLIS:30000}
    statement-limit: ${ORKNUX_SCRIPT_STATEMENT_LIMIT:5000000}
    # The lowest level a function's own `orknux.log` calls are kept at: debug,
    # info, warn, error, or off. Decided inside the sandbox, so tracing left in
    # a function costs one comparison while it is turned off - turn this down to
    # find something without editing anybody's code.
    log-level: ${ORKNUX_SCRIPT_LOG_LEVEL:info}
  library:
    registry:
      # Where an administrator's "install random@4.1.0" fetches from. The fetch
      # happens once, on the server, into the database: the file it brings back
      # is what is stored and what runs, the sandbox gains no network, and the
      # registry is never consulted again.
      #
      # Point it at a mirror to install from one. Set it empty for an
      # installation with no way out - the Libraries screen then offers the
      # upload alone rather than a field that fails on being used.
      url: ${ORKNUX_LIBRARY_REGISTRY_URL:https://registry.npmjs.org}
      # How long the registry has to answer, for the metadata and for the file.
      timeout: ${ORKNUX_LIBRARY_REGISTRY_TIMEOUT:30s}
  plugin:
    # A plugin runs in its own sandbox, configured separately from a workspace's
    # functions on purpose. Its budget is the larger of the two: a plugin is a
    # bundle, and loading one is more work than calling one exported function.
    timeout-millis: ${ORKNUX_PLUGIN_TIMEOUT_MILLIS:30000}
    statement-limit: ${ORKNUX_PLUGIN_STATEMENT_LIMIT:10000000}
    # The same, for plugins, and separate on purpose: a plugin is somebody
    # else's code, and debugging one should not mean turning up every function
    # this installation wrote itself.
    log-level: ${ORKNUX_PLUGIN_LOG_LEVEL:info}
  execution:
    retention:
      # How long a finished run is kept. Ninety days rather than the fourteen a
      # component's history gets: a revision is a copy of source nobody reads
      # twice, a run is the record of something that happened, and the questions
      # asked of it are asked weeks later. The file is where a fresh
      # installation starts; Admin -> Settings is the answer from then on.
      #
      # A run still going is never swept, whatever the clock says.
      retention-days: ${ORKNUX_EXECUTION_RETENTION_DAYS:90}
      # False sweeps nothing on a timer, which is what the suite sets so that no
      # clock deletes a row in the middle of a test.
      sweep-enabled: ${ORKNUX_EXECUTION_SWEEP_ENABLED:true}
    inline:
      # Only the inline engine. It waits out a parked step on the thread
      # carrying the run, so a run may spend this long waiting in total before
      # the step fails and says what would have carried it. A Temporal wait is a
      # timer, holds nothing, and is bounded by run-timeout-hours instead.
      max-wait: ${ORKNUX_INLINE_MAX_WAIT:5m}
  task:
    # What one task may spend before it is stopped and told so. An agent running
    # until it decides it is done is an unbounded bill, so there are two
    # ceilings: the turns bound how often the model is asked, and the working
    # time bounds what happens between two of them - a shell command, an MCP
    # server that takes its time - which no count of turns can express.
    #
    # Both are copied onto a task when it is created, so raising these does not
    # extend a task already running and lowering them does not kill one.
    max-turns: ${ORKNUX_TASK_MAX_TURNS:40}
    # Working time, and not wall clock: a task parked for two days waiting to be
    # approved has spent none of it.
    working-time: ${ORKNUX_TASK_WORKING_TIME:2h}
    # How long a task parked for permission or for an answer waits before it
    # gives up. Long enough to cover a holiday, short enough that a forgotten
    # task is eventually a finished one.
    patience: ${ORKNUX_TASK_PATIENCE:7d}
    sweep:
      # The net under the hand-over.
      #
      # A task is recorded and then handed to whatever carries it, and that
      # hand-over can be lost - a process killed at the wrong moment, a pool
      # that refuses the work, or a Temporal workflow that starts and cannot
      # run. The row then says QUEUED for ever. So something looks, and hands
      # over anything queued longer than this; the same number is how often it
      # looks.
      #
      # Five minutes. A task leaves QUEUED in the time it takes a worker to read
      # its row, so this is three hundred times the ordinary case and still
      # short enough that nobody watches a stuck task for long. Handing the same
      # task over twice is refused by the engine rather than by this number.
      #
      # Where a fresh installation starts, not the last word: on an installation
      # running the inline engine it is also a field on the Admin screen, and
      # once an administrator has set it theirs is the answer. The sweep reads it
      # on every pass, so changing it needs no restart. A Temporal installation
      # draws no field - how a stuck task is recovered there is Temporal's
      # business - and takes this number as it stands.
      minutes: ${ORKNUX_TASK_SWEEP_MINUTES:5}
      # False sweeps nothing on a timer; a lost task is then lost until a
      # restart, and on Temporal for good.
      enabled: ${ORKNUX_TASK_SWEEP_ENABLED:true}
      # After the inline engine's own revival on the way up rather than racing
      # it: that picks up everything left in flight, and this finds what it
      # could not.
      initial-delay: ${ORKNUX_TASK_SWEEP_INITIAL_DELAY:1m}
  temporal:
    # False runs workflows on the calling thread, with no retries and no
    # resumption. The tests do that; a deployment should not.
    enabled: ${ORKNUX_TEMPORAL_ENABLED:true}
    target: ${ORKNUX_TEMPORAL_TARGET:localhost:7233}
    namespace: ${ORKNUX_TEMPORAL_NAMESPACE:default}
    # Temporal's own web interface, which compose puts here. Only used to link
    # out to it — a run's history is worth looking at and that screen already
    # exists. Empty offers no links, which is right where it is not exposed.
    ui-url: ${ORKNUX_TEMPORAL_UI_URL:http://localhost:8233}
    task-queue: ${ORKNUX_TEMPORAL_TASK_QUEUE:orknux-workflow}
    # A model call is slow, so a step is given minutes, and tried again a
    # couple of times, since most of what a step does is call something else.
    # This bounds the work a step does, not what it waits for: a wait parks the
    # step and answers, so it is the run timeout that bounds a long wait.
    step-timeout-seconds: ${ORKNUX_TEMPORAL_STEP_TIMEOUT_SECONDS:300}
    step-attempts: ${ORKNUX_TEMPORAL_STEP_ATTEMPTS:3}
    run-timeout-hours: ${ORKNUX_TEMPORAL_RUN_TIMEOUT_HOURS:24}
  model:
    check:
      # Every configured provider is asked whether it still answers, so a status
      # on the screen is one that was true recently rather than whenever somebody
      # last pressed the button.
      enabled: ${ORKNUX_MODEL_CHECK_ENABLED:true}
      interval: ${ORKNUX_MODEL_CHECK_INTERVAL:5m}
      initial-delay: ${ORKNUX_MODEL_CHECK_INITIAL_DELAY:30s}
    # How long a model has to answer a chat message. Generous: a large local
    # model on a laptop is slow, and giving up on it is worse than waiting.
    timeout: ${ORKNUX_MODEL_TIMEOUT:2m}
